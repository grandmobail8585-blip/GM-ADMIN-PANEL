name: Build GM Admin Panel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP not found"
            exit 1
          fi
          unzip "$ZIP_FILE" -d extracted

      - name: Find project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle*" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-ADMIN-PANEL-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk

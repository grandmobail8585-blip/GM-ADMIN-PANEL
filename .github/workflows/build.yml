name: Build GM Admin Panel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          ARCHIVE=$(find . -maxdepth 1 -type f -name 'GMAdminPanel_fixed_project*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "Fixed project ZIP not found"
            exit 1
          fi
          unzip "$ARCHIVE" -d extracted

      - name: Build Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "Project: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-ADMIN-PANEL-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
